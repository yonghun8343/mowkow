name: Build Mowkow Executables

on:
  push:
    branches: [release] # release 브랜치에 푸시될 때마다 실행

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-latest: 우분투 리눅스
        # windows-latest: 윈도우
        # macos-13: 인텔 맥 (Intel)
        # macos-14: 애플 실리콘 맥 (ARM)
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # 프로젝트에 맞는 파이썬 버전 지정

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # pip install -r requirements.txt (의존성 패키지가 있다면 주석 해제)

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile main.py --name mk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mowkow-executable-${{ matrix.os }}
          path: dist/*
